openapi: 3.2.0
info:
  title: Humanity Shifts API
  version: '2.0'
  description: 'Operations tagged Shifts across 2 of this provider''s published API definitions: humanity-default-openapi.yml, humanity-json-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://www.humanity.com/api/v2
security:
- sec0: []
tags:
- name: Shifts
paths:
  /shifts:
    get:
      summary: GET Shifts
      description: '/shifts

        Permission level: 7'
      operationId: get-shifts
      parameters:
      - name: overnight
        in: query
        schema:
          type: integer
          format: int32
      - name: start_limit
        in: query
        description: 'Works only with mode : Open, it behaves like offset in this case.'
        schema:
          type: integer
          format: int32
      - name: end_limit
        in: query
        description: 'Works only with mode : Open, it behaves like limit in a combination with start_limit parameter'
        schema:
          type: integer
          format: int32
      - name: start_date
        in: query
        schema:
          type: string
      - name: end_date
        in: query
        schema:
          type: string
      - name: mode
        in: query
        description: 'Can be one of the following: overview, location, schedule, incomplete, employees, employee, open, openapproval, confirm, onnow, late, upcoming, recent, multiple.<br> If mode is not set, it defaults to ''employee''.'
        schema:
          type: string
      - name: schedule
        in: query
        description: 'Works only with modes: confirm, location, schedule, employees, where it acts as a position filter. Accepts a string with comma-separated Position IDs'
        schema:
          type: string
      - name: location
        in: query
        description: 'Works only with modes: confirm, employees, where it acts as a location filter. Accepts an integer which represents a Location ID'
        schema:
          type: integer
          format: int32
      - name: employees
        in: query
        description: 'Works with modes: confirm, employees, where it accepts a string with comma-separated Employee IDs.<br>With modes upcoming, recent, or employee, it accepts only one Employee ID. In all cases it behaves like a filter by employee(s).'
        schema:
          type: string
      - name: detailed
        in: query
        description: If set to 1, the response will have additional information regarding employees, their conflicts, availability to work, count of shifts in a series if they are part of a series.<br>It's recommended not to use this parameter if not needed because it will make request noticeably slower.
        schema:
          type: integer
          format: int32
      - name: budget
        in: query
        description: 'Works with all modes except for "multiple". Accepted values: 0 or 1. If set to 1, the response will have extra information about budget data entered for the date range between provided start_date and end_date'
        schema:
          type: integer
          format: int32
      - name: vacation
        in: query
        description: '[0, 1]'
        schema:
          type: integer
          format: int32
      - name: filter_by_site
        in: query
        schema:
          type: string
      - name: filter_by_employee
        in: query
        schema:
          type: string
      - name: filter_by_skill
        in: query
        schema:
          type: string
      - name: filled
        in: query
        description: '[0, 1]'
        schema:
          type: integer
          format: int32
      - name: include_ghost_shifts
        in: query
        description: Works only with modes location and schedule. If set to true, the response will include shifts of employees which are assigned to positions listed with the parameter "schedule" or all positions under a location provided with the parameter "location".
        schema:
          type: boolean
      - in: query
        name: fields[shift]
        schema:
          type: string
        description: "Use this parameter to return only specific fields in the response, reducing payload size. Pass the resource type in brackets and a comma-separated list of the fields you want included.\n\nExample: \nhttps://www.humanity.com/api/v2/shifts?mode=overview&start_date=2026-02-01&end_date=2026-03-01&fields[shift]=employees,schedule,schedule_name,start_timestamp,end_timestamp"
        required: false
      responses:

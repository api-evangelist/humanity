paths:
  /preclockins:
    get:
      summary: GET Preclockins
      description: '/preclockins

        Permission level: 3'
      operationId: get-preclockins
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": 1,\n    \"data\": [\n        {\n            \"id\": \"370088\",\n            \"user\": \"3999339\",\n            \"store\": \"343161\",\n            \"status\": \"0\",\n            \"timestamp\": \"1545861308\",\n            \"end_timestamp\": \"0\",\n            \"name\": \"Alan Ford\"\n        },\n        {\n            \"id\": \"333457\",\n            \"user\": \"4010494\",\n            \"store\": \"343161\",\n            \"status\": \"0\",\n            \"timestamp\": \"1536925297\",\n            \"end_timestamp\": \"0\",\n            \"name\": \"Dilan Dog\"\n        }\n    ],\n    \"metadata\": [],\n    \"token\": \"xxxxxxx\",\n    \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '370088'
                        user:
                          type: string
                          example: '3999339'
                        store:
                          type: string
                          example: '343161'
                        status:
                          type: string
                          example: '0'
                        timestamp:
                          type: string
                          example: '1545861308'
                        end_timestamp:
                          type: string
                          example: '0'
                        name:
                          type: string
                          example: Alan Ford
                  metadata:
                    type: array
                  token:
                    type: string
                    example: xxxxxxx
                  error: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/preclockins?access_token=xxxxxxx
        samples-languages:
        - http
      tags:
      - Preclockins

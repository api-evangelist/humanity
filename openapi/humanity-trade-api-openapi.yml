paths:
  /trade/{id}:
    get:
      summary: GET Trade
      description: '/trades/:id

        Permission level: 5'
      operationId: get-trade
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: with_conflicts
        in: path
        schema:
          type: boolean
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"status\":1,\n   \"data\":[\n      {\n         \"id\":\"238\",\n         \"status\":\"0\",\n         \"user\":\"5144\",\n         \"shift\":\"94220\",\n         \"store\":\"11\",\n         \"reference\":null,\n         \"reason\":\"No big reason\",\n         \"date\":\"1339498178\",\n         \"confirm_before\":\"0\",\n         \"confirm_after\":\"0\",\n         \"trade_to\":\"0\",\n         \"shift_start_date\":{\n            \"id\":\"1150\",\n            \"month\":\"6\",\n            \"day\":\"22\",\n            \"year\":\"2012\",\n            \"weekday\":\"Fri\",\n            \"mname\":\"Jun\",\n            \"week\":\"25\",\n            \"dayid\":6,\n            \"formatted\":\"Jun 22, 2012\"\n         }\n      }\n   ],\n  \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '238'
                        status:
                          type: string
                          example: '0'
                        user:
                          type: string
                          example: '5144'
                        shift:
                          type: string
                          example: '94220'
                        store:
                          type: string
                          example: '11'
                        reference: {}
                        reason:
                          type: string
                          example: No big reason
                        date:
                          type: string
                          example: '1339498178'
                        confirm_before:
                          type: string
                          example: '0'
                        confirm_after:
                          type: string
                          example: '0'
                        trade_to:
                          type: string
                          example: '0'
                        shift_start_date:
                          type: object
                          properties:
                            id:
                              type: string
                              example: '1150'
                            month:
                              type: string
                              example: '6'
                            day:
                              type: string
                              example: '22'
                            year:
                              type: string
                              example: '2012'
                            weekday:
                              type: string
                              example: Fri
                            mname:
                              type: string
                              example: Jun
                            week:
                              type: string
                              example: '25'
                            dayid:
                              type: integer
                              example: 6
                              default: 0
                            formatted:
                              type: string
                              example: Jun 22, 2012
                  error: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/trade/238?access_token=xxxxxxx
        samples-languages:
        - http
      tags:
      - Trade
  /trade/{mode}:
    get:
      summary: GET Trades
      description: '/trades

        Permission level: 5'
      operationId: get-trades
      parameters:
      - name: mode
        in: path

45\",\n                  \"confirmed\":\"0\",\n                  \"approved\":\"0\",\n                  \"sms\":\"0\",\n                  \"email\":\"0\",\n                  \"online\":\"0\",\n                  \"user_name\":\"Ian Graham\"\n               }\n            ]\n         }\n      }\n   ],\n  \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '238'
                        status:
                          type: string
                          example: '0'
                        user:
                          type: string
                          example: '5144'
                        shift:
                          type: string
                          example: '94220'
                        store:
                          type: string
                          example: '11'
                        reference: {}
                        reason:
                          type: string
                          example: No big reason
                        date:
                          type: string
                          example: '1339498178'
                        confirm_before:
                          type: string
                          example: '0'
                        confirm_after:
                          type: string
                          example: '0'
                        trade_to:
                          type: string
                          example: '0'
                        shift_start_date:
                          type: object
                          properties:
                            id:
                              type: string
                              example: '1150'
                            month:
                              type: string
                              example: '6'
                            day:
                              type: string
                              example: '22'
                            year:
                              type: string
                              example: '2012'
                            weekday:
                              type: string
                              example: Fri
                            mname:
                              type: string
                              example: Jun
                            week:
                              type: string
                              example: '25'
                            dayid:
                              type: integer
                              example: 6
                              default: 0
                            formatted:
                              type: string
                              example: Jun 22, 2012
                        shift_start:
                          type: string
                          example: '33'
                        shift_end:
                          type: string
                          example: '73'
                        shift_schedule:
                          type: string
                          example: '33499'
                        schedule_name:
                          type: string
                          example: Budget 1
                        user_name:
                          type: string
                          example: Andy
                        requested:
                          type: object
                          properties:
                            id:
                              type: string
                              example: '1140'
                            month:
                              type: string
                              example: '6'
                            day:
                              type: string
                              example: '12'
                            year:
                              type: string
                              example: '2012'
                            weekday:
                              type: string
                              example: Tue
                            mname:
                              type: string
                              example: Jun
                            week:
                              type: string
                              example: '24'
                            dayid:
                              type: integer
                              example: 3
                              default: 0
                            formatted:
                              type: string
                              example: Jun 12, 2012
                        shift_start_time:
                          type: string
                          example: 8 am
                        shift_end_time:
                          type: string
                          example: 6 pm
                        traders:
                          type: object
                          properties:
                            count:
                              type: integer
                              example: 2
                              default: 0
                            data:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    example: '2297'
                                  trade_id:
                                    type: string
                                    example: '238'
                                  shift:
                                    type: string
                                    example: '94220'
                                  user:
                                    type: string
                                    example: '5145'
                                  confirmed:
                                    type: string
                                    example: '0'
                                  approved:
                                    type: string
                                    example: '0'
                                  sms:
                                    type: string
                                    example: '0'
                                  email:
                                    type: string
                                    example: '0'
                                  online:
                                    type: string
                                    example: '0'
                                  user_name:
                                    type: string
                                    example: Bond
                  error: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:

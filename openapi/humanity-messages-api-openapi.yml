openapi: 3.2.0
info:
  title: default Messages API
  version: '2.0'
servers:
- url: https://www.humanity.com/api/v2
security:
- sec0: []
tags:
- name: Messages
paths:
  /messages:
    get:
      summary: GET Messages
      description: '/messages

        Permission level: 5'
      operationId: get-messages
      parameters:
      - name: mode
        in: query
        description: 'Mode (enum[inbox,outbox])  **inbox: Recived messages - outbox: Sent messages**'
        schema:
          type: string
      - name: limit
        in: query
        description: Sets the limit for the number of returned messages
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: string
      - name: id
        in: query
        description: Message id
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": 1,\n    \"data\": {\n        \"4055810\": {\n            \"id\": 4055810,\n            \"conversation\": 4055810,\n            \"sender\": 3842511,\n            \"sent\": 1522830003,\n            \"deleted\": 0,\n            \"subject\": \"Hello\",\n            \"message\": \"Hello World\",\n            \"grouped\": 0,\n            \"receivers\": {\n                \"schedules\": [],\n                \"individuals\": [\n                    \"3842510\"\n                ]\n            },\n            \"read\": 0\n        },\n        \"4055811\": {\n            \"id\": 4055811,\n            \"conversation\": 4055811,\n            \"sender\": 3842511,\n            \"sent\": 1522830308,\n            \"deleted\": 0,\n            \"subject\": \"Shift pickup\",\n            \"message\": \"Good morning Chuck, let me know if there is a shift available for pick up.\\n\\nThanks\",\n            \"grouped\": 0,\n            \"receivers\": {\n                \"schedules\": [],\n                \"individuals\": [\n                    \"3842510\"\n                ]\n            },\n            \"read\": 0\n        }\n    },\n    \"metadata\": [],\n    \"token\": \"xxxxxxxxxx\",\n    \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: object
                    properties:
                      '4055810':
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 4055810
                            default: 0
                          conversation:
                            type: integer
                            example: 4055810
                            default: 0
                          sender:
                            type: integer
                            example: 3842511
                            default: 0
                          sent:
                            type: integer
                            example: 1522830003
                            default: 0
                          deleted:
                            type: integer
                            example: 0
                            default: 0
                          subject:
                            type: string
                            example: Hello
                          message:
                            type: string
                            example: Hello World
                          grouped:
                            type: integer
                            example: 0
                            default: 0
                          receivers:
                            type: object
                            properties:
                              schedules:
                                type: array
                              individuals:
                                type: array
                                items:
                                  type: string
                                  example: '3842510'
                          read:
                            type: integer
                            example: 0
                            default: 0
                      '4055811':
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 4055811
                            default: 0
                          conversation:
                            type: integer
                            example: 4055811
                            default: 0
                          sender:
                            type: integer
                            example: 3842511
                            default: 0
                          sent:
                            type: integer
                            example: 1522830308
                            default: 0
                          deleted:
                            type: integer
                            example: 0
                            default: 0
                          subject:
                            type: string
                            example: Shift pickup
                          message:
                            type: string
                            example: 'Good morning Chuck, let me know if there is a shift available for pick up.


                              Thanks'

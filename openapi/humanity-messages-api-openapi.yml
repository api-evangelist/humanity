      x-readme:
        code-samples:
        - language: html
          code: https://www.humanity.com/api/v2/messages?access_token=xxxxxxxxx
        samples-languages:
        - html
      tags:
      - Messages
    post:
      summary: POST Message
      description: '/messages

        Permission level: 5'
      operationId: post-message
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - subject
              - message
              - individual_receivers
              - group_receivers
              properties:
                subject:
                  type: string
                message:
                  type: string
                individual_receivers:
                  type: integer
                  description: Id of the receiver
                  format: int32
                group_receivers:
                  type: string
                  description: Position id
                conversation:
                  type: integer
                  description: Conversation id - this parameter is used for replying the messages
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": 1,\n    \"data\": {\n        \"id\": 4055815,\n        \"conversation\": 4055815,\n        \"sender\": \"3842510\",\n        \"sent\": \"Apr 4, 2018 10:50am\",\n        \"deleted\": null,\n        \"subject\": \"Hello Sir\",\n        \"message\": \"<p>And one more thing</p>\",\n        \"grouped\": 0,\n        \"receivers\": \"{\\\"schedules\\\":[],\\\"individuals\\\":[\\\"3842511\\\"]}\",\n        \"read\": null\n    },\n    \"metadata\": [],\n    \"token\": \"4988a1bb9f57ab1b964c8df681e376c45beb0cb7\",\n    \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4055815
                        default: 0
                      conversation:
                        type: integer
                        example: 4055815
                        default: 0
                      sender:
                        type: string
                        example: '3842510'
                      sent:
                        type: string
                        example: Apr 4, 2018 10:50am
                      deleted: {}
                      subject:
                        type: string
                        example: Hello Sir
                      message:
                        type: string
                        example: <p>And one more thing</p>
                      grouped:
                        type: integer
                        example: 0
                        default: 0
                      receivers:
                        type: string
                        example: '{"schedules":[],"individuals":["3842511"]}'
                      read: {}
                  metadata:
                    type: array
                  token:
                    type: string
                    example: 4988a1bb9f57ab1b964c8df681e376c45beb0cb7
                  error: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: html
          code: https://www.humanity.com/api/v2/messages?access_token=xxxxxxx
        samples-languages:
        - html
      tags:
      - Messages
    delete:
      summary: DELETE Message
      description: '/messages/:id

        Permission level: 5'
      operationId: delete-message
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - messages
              - mode
              properties:
                messages:
                  type: integer
                  description: Message id's
                  format: int32
                mode:
                  type: string
                  description: inbox, sentbox
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": 1,\n    \"data\": 1,\n    \"metadata\": [],\n    \"token\": \"xxxxxx\",\n    \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: integer
                    example: 1
                    default: 0
                  metadata:
                    type: array
                  token:
                    type: string
                    example: xxxxxx
                  error: {}
        '400':

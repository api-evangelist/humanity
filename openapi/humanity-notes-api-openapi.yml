            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                note:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\": 1,\n  \"data\": \"Note updated\",\n  \"token\": \"xxx\",\n  \"error\": null\n}"
              schema:
                type: object

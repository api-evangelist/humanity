paths:
  /notes:
    get:
      summary: GET Notes
      description: '/notes

        Permission level: 7'
      operationId: get-notes
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - start_date
              properties:
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                valid:
                  type: integer
                  description: min length 1
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\": 1,\n  \"data\": {\n    \"43381\": {\n      \"note\": \"drtghdfghdfgh\",\n      \"author\": \"Ryan Fyfe\",\n      \"author_id\": \"2\",\n      \"date\": \"2835\",\n      \"created\": \"Jan 31, 2017-05:27\",\n      \"date_formatted\": \"Feb 1, 2017\",\n      \"published\": \"1485858423\"\n    },\n    \"43382\": {\n      \"note\": \"asdfasfa\",\n      \"author\": \"Ryan Fyfe\",\n      \"author_id\": \"2\",\n      \"date\": \"2835\",\n      \"created\": \"Jan 31, 2017-05:27\",\n      \"date_formatted\": \"Feb 1, 2017\",\n      \"published\": \"0\"\n    }\n  },\n  \"token\": \"xxxx\",\n  \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: object
                    properties:
                      '43381':
                        type: object
                        properties:
                          note:
                            type: string
                            example: drtghdfghdfgh
                          author:
                            type: string
                            example: Ryan Fyfe
                          author_id:
                            type: string
                            example: '2'
                          date:
                            type: string
                            example: '2835'
                          created:
                            type: string
                            example: Jan 31, 2017-05:27
                          date_formatted:
                            type: string
                            example: Feb 1, 2017
                          published:
                            type: string
                            example: '1485858423'
                      '43382':
                        type: object
                        properties:
                          note:
                            type: string
                            example: asdfasfa
                          author:
                            type: string
                            example: Ryan Fyfe
                          author_id:
                            type: string
                            example: '2'
                          date:
                            type: string
                            example: '2835'
                          created:
                            type: string
                            example: Jan 31, 2017-05:27
                          date_formatted:
                            type: string
                            example: Feb 1, 2017
                          published:
                            type: string
                            example: '0'
                  token:
                    type: string
                    example: xxxx
                  error: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/notes?access_token=xxxxxxx
        samples-languages:
        - http
      tags:
      - Notes
    post:
      summary: POST Note
      description: '/notes

        Permission level: 7'
      operationId: post-note
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - date
              - note
              properties:
                date:
                  type: string
                  format: date
                note:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\": 1,\n  \"data\": \"Note created\",\n  \"token\": \"xxx\",\n  \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: string
                    example: Note created
                  token:
                    type: string
                    example: xxx
                  error: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/notes?access_token=xxxxxxx
        samples-languages:
        - http
      tags:
      - Notes
  /notes/{id}:
    get:
      summary: GET Note
      description: '/notes/:id

        Permission level: 7'
      operationId: get-note
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\": 1,\n  \"data\": {\n    \"day\": \"2835\",\n    \"note\": \"drtghdfghdfgh\",\n    \"name\": \"Ryan Fyfe\",\n    \"id\": \"43381\",\n    \"created\": \"1485858420\"\n  },\n  \"token\": \"xxx\",\n  \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: object
                    properties:
                      day:
                        type: string
                        example: '2835'
                      note:
                        type: string
                        example: drtghdfghdfgh
                      name:
                        type: string
                        example: Ryan Fyfe
                      id:
                        type: string
                        example: '43381'
                      created:
                        type: string
                        example: '1485858420'
                  token:
                    type: string
                    example: xxx
                  error: {}
        '400':

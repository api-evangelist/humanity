openapi: 3.2.0
info:
  title: default Employees API
  version: '2.0'
servers:
- url: https://www.humanity.com/api/v2
security:
- sec0: []
tags:
- name: Employees
paths:
  /employees:
    get:
      summary: GET Employees
      description: '/employees

        Permission level: 7'
      operationId: get-employees
      parameters:
      - name: schedule
        in: query
        description: Position ID. Parameter for filtering purpose. If set, only employees assigned on that position will be fetched.
        schema:
          type: integer
          format: int32
      - name: location
        in: query
        description: Location ID
        schema:
          type: integer
          format: int32
      - name: disabled
        in: query
        description: 'enum [1] -> 1: Return disabled employees'
        schema:
          type: integer
          format: int32
      - name: inactive
        in: query
        description: 'enum [1] -> 1: Return inactive employees'
        schema:
          type: integer
          format: int32
      - name: with_custom_fields
        in: query
        description: 'enum[0,1] -> 0: Do not retrieve employee custom fields; 1: Retrieve employee custom fields'
        schema:
          type: integer
          format: int32
      - name: scheduler_users
        in: query
        description: 'enum [1] -> 1: Retrieves staff user that can see on schedule if staff gallery is off'
        schema:
          type: integer
          format: int32
      - name: check_permission
        in: query
        description: enum [1]
        schema:
          type: integer
          format: int32
      - in: query
        name: fields[employee]
        schema:
          type: string
          enum:
          - id
          - avatar
          - legacy_avatar
          - avatar_url
          - name
          - p_phone
          - p_email
          - cell_phone
          - home_phone
          - email
          - group_name
          - status_name
          - vendor_id
          - schedules
          - skills
          - registered
          - last_active
          - birth_day
          - birth_month
          - birth_year
          - work_start_date
          - location
          - state
          - city
          - zip
          - nick_name
          - username
          - address
          - include_skill_data
        description: Multiple values can be used, separated by commas. Using include_skill_data with skills expands the skill response to include name and expiration data.

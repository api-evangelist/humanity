openapi: 3.2.0
info:
  title: default Locations API
  version: '2.0'
servers:
- url: https://www.humanity.com/api/v2
security:
- sec0: []
tags:
- name: Locations
paths:
  /locations:
    get:
      summary: GET Locations
      description: '/locations

        Permission level: 7'
      operationId: get-locations
      parameters:
      - name: type
        in: query
        description: 'enum[1,2] -> 1: Location; 2: Remote sites'
        schema:
          type: integer
          format: int32
      - name: updated_at
        in: query
        description: DateTime in ISO8601 format. <br> Retrieves only locations that were updated <strong>after</strong> the date and time provided with this parameter.
        schema:
          type: string
          format: date
      - name: include_deleted
        in: query
        description: 'enum[0,1] -> 0: Do not Include deleted locations; 1: Include deleted locations'
        schema:
          type: integer
          format: int32
      - name: filter[id]
        in: query
        description: Filters response by location ids. Those ids should be coma separated.
        schema:
          type: string
      - name: filter[only_primary]
        in: query
        description: Response will return only primary location if this is set to 1.
        schema:
          type: integer
          format: int32
      - name: filter[include_primary]
        in: query
        description: By default, primary location is excluded from response. It can be included by setting the value to 1.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\": 1,\n  \"data\": [\n    {\n      \"id\": 542311,\n      \"name\": \"Dream Coffee Shop 2\",\n      \"country\": \"NL\",\n      \"address\": \"Wijde Heisteeg 4, 1016 AS Amsterdam, Netherlands\",\n      \"lat\": 52.3687499,\n      \"lon\": 4.8875525,\n      \"store\": 251300,\n      \"type\": 1,\n      \"notes\": \"\",\n      \"timezone_id\": 311,\n      \"map\": \"https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Wijde+Heisteeg+4%2C+1016+AS+Amsterdam%2C+Netherlands%2C+NL\",\n      \"directions\": \"https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Wijde+Heisteeg+4%2C+1016+AS+Amsterdam%2C+Netherlands%2C+NL\"\n    },\n    {\n      \"id\": 542312,\n      \"name\": \"Dream Coffee Takeaway\",\n      \"country\": \"RS\",\n      \"address\": \"Kneginje Zorke 25, Beograd 11000, Serbia\",\n      \"lat\": 44.80096,\n      \"lon\": 20.4691562,\n      \"store\": 251300,\n      \"type\": 2,\n      \"notes\": \"coffee takeaway\",\n      \"timezone_id\": 314,\n      \"map\": \"https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Kneginje+Zorke+25%2C+Beograd+11000%2C+Serbia%2C+RS\",\n      \"directions\": \"https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Kneginje+Zorke+25%2C+Beograd+11000%2C+Serbia%2C+RS\"\n    }\n  ],\n  \"token\": \"xxxxxxx\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 542311
                          default: 0
                        name:
                          type: string
                          example: Dream Coffee Shop 2
                        country:
                          type: string
                          example: NL
                        address:
                          type: string
                          example: Wijde Heisteeg 4, 1016 AS Amsterdam, Netherlands
                        lat:
                          type: number
                          example: 52.3687499
                          default: 0
                        lon:
                          type: number
                          example: 4.8875525
                          default: 0
                        store:
                          type: integer
                          example: 251300
                          default: 0
                        type:
                          type: integer
                          example: 1
                          default: 0
                        notes:
                          type: string
                          example: ''
                        timezone_id:
                          type: integer
                          example: 311
                          default: 0
                        map:
                          type: string
                          example: https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Wijde+Heisteeg+4%2C+1016+AS+Amsterdam%2C+Netherlands%2C+NL
                        directions:
                          type: string
                          example: https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Wijde+Heisteeg+4%2C+1016+AS+Amsterdam%2C+Netherlands%2C+NL
                  token:
                    type: string
                    example: xxxxxxx
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/locations?access_token=xxxxxxx
        samples-languages:
        - http
      tags:
      - Locations
    post:
      summary: POST Location
      description: '/locations

        Permission level: 5'
      operationId: post-location
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - name
              - type
              properties:
                name:
                  type: string
                type:
                  type: integer
                  description: 'enum (1, 2) -> 1: Location; 2: Remote Site'
                  format: int32
                country:
                  type: string
                address:
                  type: string
                lat:
                  type: string
                lon:
                  type: string
                timezone_id:
                  type: integer
                  format: int32
                store:
                  type: integer
                  format: int32
                copy_location_id:
                  type: integer
                  description: Copy positions from another location.
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\": 1,\n  \"data\": {\n    \"id\": 542317,\n    \"name\": \"Dream Coffee Takeaway\",\n    \"country\": \"\",\n    \"address\": \"Ulica Kneza Milosa\",\n    \"lat\": \"\",\n    \"lon\": \"\",\n    \"store\": 251300,\n    \"type\": 2,\n    \"notes\": \"\",\n    \"timezone_id\": null,\n    \"map\": \"https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Ulica+Kneza+Milosa%2C+\",\n    \"directions\": \"https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Ulica+Kneza+Milosa%2C+\"\n  },\n  \"token\": \"xxxxxxx\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 542317
                        default: 0
                      name:
                        type: string
                        example: Dream Coffee Takeaway
                      country:
                        type: string
                        example: ''
                      address:
                        type: string
                        example: Ulica Kneza Milosa
                      lat:
                        type: string
                        example: ''
                      lon:
                        type: string
                        example: ''
                      store:
                        type: integer
                        example: 251300
                        default: 0
                      type:
                        type: integer
                        example: 2
                        default: 0
                      notes:
                        type: string
                        example: ''
                      timezone_id: {}
                      map:
                        type: string
                        example: https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Ulica+Kneza+Milosa%2C+
                      directions:
                        type: string
                        example: https://maps.google.com/maps?f=q&source=s_q&hl=en&geocode=&q=Ulica+Kneza+Milosa%2C+
                  token:
                    type: string
                    example: xxxxxxx
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/locations?access_token=xxxxxxx
        - language: text
          code: 'name=Dream Coffee Takeaway

            type=2

            address=Ulica Kneza Milosa'
          name: BODY PARAMS
        samples-languages:
        - http
        - text
      tags:
      - Locations

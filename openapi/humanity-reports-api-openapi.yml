  /reports/timesheets:
    get:
      summary: GET Timesheets Report
      description: '/reports/timesheets

        Permission level: 5'
      operationId: get-timesheets-report
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: type
        in: query
        description: enum[timesheets_summary, timesheets_attendance, timesheets_late_summary]
        required: true
        schema:
          type: string
      - name: deductbreaks
        in: query
        description: 'null or 0 : Do not deduct breaks, 1: Deduct breaks'
        schema:
          type: integer
          format: int32
      - name: location
        in: query
        schema:
          type: integer
          format: int32
      - name: schedule
        in: query
        description: Array of schedule ids (eg. "234,563,770")
        schema:
          type: string
      - name: employee
        in: query
        description: Array of employees ids (eg. "234,563,770")
        schema:
          type: string
      - name: skill

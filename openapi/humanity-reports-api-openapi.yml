openapi: 3.2.0
info:
  title: default Reports API
  version: '2.0'
servers:
- url: https://www.humanity.com/api/v2
security:
- sec0: []
tags:
- name: Reports
paths:
  /reports/custom:
    get:
      summary: GET Custom Report
      description: '/reports/custom

        Permission level: 3'
      operationId: get-custom-report
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: type
        in: query
        description: enum[timesheets, confirmedtimesheets, shifts, confirmedshifts, openshifts]
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: 'The fields we want to have in the response.<br>The list depends on the selected parameter **type**.<br>For **timesheets**: ''employee'', ''eid'', ''user'', ''location'', ''schedule_id'', ''schedule_name'', ''start_day'', ''end_day'', ''start_time'', ''end_time'', ''total_time'', ''notes''<br>For **confirmedtimesheets**: ''employee'', ''eid'', ''user'', ''location'', ''schedule_id'', ''schedule_name'', ''start_day'', ''end_day'', ''start_time'', ''end_time'', ''total_time'', ''rate'', ''ratecard'', ''special'', ''overtime'', ''cost'', ''notes''<br>For **shifts**: ''employee'', ''eid'', ''user'', ''location'', ''schedule_id'', ''schedule_name'', ''start_day'', ''end_day'', ''start_time'', ''end_time'', ''total_time'', ''title'', ''notes''<br>For **confirmedshifts**: ''employee'', ''eid'', ''user'', ''location'', ''schedule_id'', ''schedule_name'', ''start_day'', ''end_day'', ''start_time'', ''end_time'', ''total_time'', ''title'', ''notes''<br>For **openshifts**: ''employees'', ''slots'', ''location'', ''schedule_id'', ''schedule_name'', ''start_day'', ''end_day'', ''start_time'', ''end_time'', ''total_time'', ''title'', ''notes'', ''published'''
        required: true
        schema:
          type: string
      - name: schedule
        in: query
        description: Array of Position (schedule) IDs (eg. 1639285,743314,743310) as comma-separated integer values
        schema:
          type: string
      - name: employee
        in: query
        description: Array of Employee IDs (eg. 1417022,4513152,2479828) as comma-separated integer values
        schema:
          type: string
      - name: location
        in: query
        schema:
          type: integer
          format: int32
      - name: skill
        in: query
        schema:
          type: string
      - name: deduct_breaks
        in: query
        description: Can be either 0 or 1
        schema:
          type: integer
          format: int32
      - name: remote_site
        in: query
        schema:
          type: integer
          format: int32
      - name: options
        in: query
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"status\":\"1\",\n   \"data\":[\n      {\n         \"employee\":\"Alan\"\n      },\n      {\n         \"employee\":\"Bond\"\n      },\n      {\n         \"employee\":\"Brian\"\n      },\n      {\n         \"employee\":\"Peter\"\n      },\n      {\n         \"employee\":\"stewie \"\n      }\n   ],\n   \"token\":\"xxxxxxx\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: '1'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        employee:
                          type: string
                          example: Alan
                  token:
                    type: string
                    example: xxxxxxx
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/reports/custom?access_token=xxxxxxx
        samples-languages:
        - http
      tags:
      - Reports
  /reports/daily_peak_hours:
    get:
      summary: GET Daily Peak Hours Report
      description: '/reports/daily_peak_hours

        Permission level: 3'
      operationId: get-daily-peak-hours-report
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: location
        in: query
        schema:
          type: string
      - name: schedule
        in: query
        description: Array of schedule ids (eg."234,563,770")
        schema:
          type: string
      - name: skill
        in: query
        schema:
          type: string
      - name: remote_site
        in: query
        schema:
          type: integer
          format: int32
      - name: exclude_disabled_emp
        in: query
        description: enum[-1,1]
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\": 1,\n  \"data\": {\n    \"2835\": {\n      \"locations\": {        \n        \"1\": {\n          \"861\": {\n            \"schedule_name\": \"Live Chat &amp; Tickets\",\n            \"chunks\": {\n              \"0\": 60,\n              \"1\": 60,\n              \"2\": 60,\n              \"3\": 60,\n              \"4\": 60,\n              \"5\": 60,\n              \"21\": 60,\n              \"22\": 60,\n              \"23\": 60\n            },\n            \"total\": 9\n          },\n          \"75764\": {\n            \"schedule_name\": \"Setups\",\n            \"chunks\": [],\n            \"total\": 0\n          }\n      },\n      \"total\": 9\n    }\n  },\n  \"token\": \"xxx\",\n  \"error\": null\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/reports/daily_peak_hours?access_token=xxxxxxx
        samples-languages:
        - http
      tags:
      - Reports
  /reports/employee:
    get:
      summary: GET Employee Report
      description: '/reports/employee

        Permission level: 5'
      operationId: get-employee-report
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: type
        in: query
        description: enum[attendance, vacations, availability, unavailability, hourly-availability, vacation-summary]
        required: true
        schema:
          type: string

        in: query
        schema:
          type: integer
          format: int32
      - name: leave_type
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"status\":1,\n   \"data\":{\n      \"statuses\":{\n         \"1\":\"All Day\",\n         \"2\":\"Available\",\n         \"3\":\"On Vacation\",\n         \"4\":\"Not Available\"\n      },\n      \"dates\":[\n         {\n            \"id\":1326,\n            \"date\":{\n               \"id\":1326,\n               \"month\":12,\n               \"day\":15,\n               \"wday\":6,\n               \"year\":2012,\n               \"weekday\":\"Sat\",\n               \"mname\":\"Dec\",\n               \"week\":51,\n               \"dayid\":7,\n               \"timeid\":1,\n               \"formatted\":\"Dec 15, 2012\",\n               \"time\":\"00:00\",\n               \"timestamp\":1355526000,\n               \"hours\":0,\n               \"minutes\":0,\n               \"seconds\":0,\n               \"date\":\"2012-12-15 00:00:00\",\n               \"day_of_year\":\"349\",\n               \"sp_wday\":7\n            },\n            \"formatted\":\"Dec 15, 2012\"\n         },\n         {\n            \"id\":1327,\n            \"date\":{\n               \"id\":1327,\n               \"month\":12,\n               \"day\":16,\n               \"wday\":0,\n               \"year\":2012,\n               \"weekday\":\"Sun\",\n               \"mname\":\"Dec\",\n               \"week\":51,\n               \"dayid\":1,\n               \"timeid\":1,\n               \"formatted\":\"Dec 16, 2012\",\n               \"time\":\"00:00\",\n               \"timestamp\":1355612400,\n               \"hours\":0,\n               \"minutes\":0,\n               \"seconds\":0,\n               \"date\":\"2012-12-16 00:00:00\",\n               \"day_of_year\":\"350\",\n               \"sp_wday\":1\n            },\n            \"formatted\":\"Dec 16, 2012\"\n         }\n      ],\n      \"users\":[\n      ]\n   },\n   \"token\":\"xxxxxxx\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: object
                    properties:
                      statuses:
                        type: object
                        properties:
                          '1':
                            type: string
                            example: All Day
                          '2':
                            type: string
                            example: Available
                          '3':
                            type: string
                            example: On Vacation
                          '4':
                            type: string
                            example: Not Available
                      dates:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1326
                              default: 0
                            date:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1326
                                  default: 0
                                month:
                                  type: integer
                                  example: 12
                                  default: 0
                                day:
                                  type: integer
                                  example: 15
                                  default: 0
                                wday:
                                  type: integer
                                  example: 6
                                  default: 0
                                year:
                                  type: integer
                                  example: 2012
                                  default: 0
                                weekday:
                                  type: string
                                  example: Sat
                                mname:
                                  type: string
                                  example: Dec
                                week:
                                  type: integer
                                  example: 51
                                  default: 0
                                dayid:
                                  type: integer
                                  example: 7
                                  default: 0
                                timeid:
                                  type: integer
                                  example: 1
                                  default: 0
                                formatted:
                                  type: string
                                  example: Dec 15, 2012
                                time:
                                  type: string
                                  example: 00:00
                                timestamp:
                                  type: integer
                                  example: 1355526000
                                  default: 0
                                hours:
                                  type: integer
                                  example: 0
                                  default: 0
                                minutes:
                                  type: integer
                                  example: 0
                                  default: 0
                                seconds:
                                  type: integer
                                  example: 0
                                  default: 0
                                date:
                                  type: string
                                  example: '2012-12-15 00:00:00'
                                day_of_year:
                                  type: string
                                  example: '349'
                                sp_wday:
                                  type: integer
                                  example: 7
                                  default: 0
                            formatted:
                              type: string
                              example: Dec 15, 2012
                      users:
                        type: array
                  token:
                    type: string
                    example: xxxxxxx
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/reports/employee?access_token=xxxxxxx
        samples-languages:
        - http
      tags:
      - Reports

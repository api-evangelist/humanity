openapi: 3.2.0
info:
  title: default Groupaccounts API
  version: '2.0'
servers:
- url: https://www.humanity.com/api/v2
security:
- sec0: []
tags:
- name: Groupaccounts
paths:
  /groupaccounts/reports/:
    get:
      summary: GET Group Reports
      description: '/group/reports

        Permission level: 3'
      operationId: get-group-reports
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: type
        in: query
        description: enum[schedule_summary,shifts_confirmed, crib_sheet, shift_exchanges, shifts_summary, open_shifts, position_summary, daily_peak_hours, budget, confirmed_timesheets, all_timesheets, group_statistics, forecast]
        required: true
        schema:
          type: string
      - name: schedule
        in: query
        description: Array of schedule ids (eg."234,563,770")
        schema:
          type: string
      - name: employee
        in: query
        description: employee id
        schema:
          type: integer
          format: int32
      - name: account
        in: query
        description: Account id
        schema:
          type: integer
          format: int32
      - name: location
        in: query
        description: location id
        schema:
          type: integer
          format: int32
      - name: skill
        in: query
        schema:
          type: integer
          format: int32
      - name: deduct_breaks
        in: query
        description: Can be either 0 or 1 - if set to 1 it will deduct the breaks
        schema:
          type: integer
          format: int32
      - name: remote_site
        in: query
        schema:
          type: integer
          format: int32
      - name: options
        in: query
        schema:
          type: integer
          format: int32
      - name: group_results
        in: query
        description: Can be 0 , 1 , 2 for grouping the results
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": 1,\n    \"data\": {\n        \"users\": [\n            {\n                \"id\": \"3475050\",\n                \"name\": \"Alex Smith\",\n                \"store\": \"303579\",\n                \"eid\": \"123456\",\n                \"group_id\": \"2\",\n                \"location\": \"0\",\n                \"shifts\": [],\n                \"total\": 0,\n                \"reports\": []\n            },\n            {\n                \"id\": \"3475064\",\n                \"name\": \"Dave Murray\",\n                \"store\": \"303579\",\n                \"eid\": \"\",\n                \"group_id\": \"5\",\n                \"location\": \"0\",\n                \"shifts\": [],\n                \"total\": 0,\n                \"reports\": []\n            },\n            {\n                \"id\": \"3475063\",\n                \"name\": \"Alex Smith\",\n                \"store\": \"303579\",\n                \"eid\": \"\",\n                \"group_id\": \"6\",\n                \"location\": \"0\",\n                \"shifts\": [],\n                \"total\": 0,\n                \"reports\": []\n            },\n            {\n                \"id\": \"3636567\",\n                \"name\": \"First Last\",\n                \"store\": \"303579\",\n                \"eid\": null,\n                \"group_id\": \"5\",\n                \"location\": \"0\",\n                \"shifts\": [],\n                \"total\": 0,\n                \"reports\": []\n            },\n            {\n                \"id\": \"3754789\",\n                \"name\": \"Lazarus George\",\n                \"store\": \"303579\",\n                \"eid\": null,\n                \"group_id\": \"5\",\n                \"location\": \"0\",\n                \"shifts\": [],\n                \"total\": 0,\n                \"reports\": []\n            },\n            {\n                \"id\": \"3526457\",\n                \"name\": \"Lewis Hamilton\",\n                \"store\": \"303579\",\n                \"eid\": \"\",\n                \"group_id\": \"4\",\n                \"location\": \"0\",\n                \"shifts\": [],\n                \"total\": 0,\n                \"reports\": []\n            },\n            {\n                \"id\": \"3480187\",\n                \"name\": \"Pierre Pires\",\n                \"store\": \"303579\",\n                \"eid\": \"\",\n                \"group_id\": \"5\",\n                \"location\": \"0\",\n                \"shifts\": [],\n                \"total\": 0,\n                \"reports\": []\n            },\n            {\n                \"id\": \"3526454\",\n                \"name\": \"Pierre Pires\",\n                \"store\": \"303579\",\n                \"eid\": \"\",\n                \"group_id\": \"5\",\n                \"location\": \"0\",\n                \"shifts\": [],\n                \"total\": 0,\n                \"reports\": []\n            },\n            {\n                \"id\": \"3475065\",\n                \"name\": \"Steve Harris\",\n                \"store\": \"303579\",\n                \"eid\": \"\",\n                \"group_id\": \"7\",\n                \"location\": \"0\",\n                \"shifts\": [],\n                \"total\": 0,\n                \"reports\": []\n            }\n        ],\n        \"dates\": [\n            {\n                \"id\": 3200,\n                \"formatted\": \"Feb 1, 2018\",\n                \"total\": 0\n            },\n            {\n                \"id\": 3201,\n                \"formatted\": \"Feb 2, 2018\",\n                \"total\": 0\n            },\n            {\n                \"id\": 3202,\n                \"formatted\": \"Feb 3, 2018\",\n                \"total\": 0\n            }\n        ],\n        \"total\": 0\n    },\n    \"token\": \"xxxxxxxx\",\n    \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: '3475050'
                            name:
                              type: string
                              example: Alex Smith
                            store:
                              type: string
                              example: '303579'
                            eid:
                              type: string
                              example: '123456'
                            group_id:
                              type: string
                              example: '2'
                            location:
                              type: string
                              example: '0'
                            shifts:
                              type: array
                            total:
                              type: integer
                              example: 0
                              default: 0
                            reports:
                              type: array
                      dates:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 3200
                              default: 0
                            formatted:
                              type: string
                              example: Feb 1, 2018
                            total:
                              type: integer
                              example: 0
                              default: 0
                      total:
                        type: integer
                        example: 0
                        default: 0
                  token:
                    type: string
                    example: xxxxxxxx
                  error: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/groupaccounts/reports/?access_token=xxxx&start_date=2017-12-01&end_date=2018-03-01&type=schedule_summary&forecast=32
        samples-languages:
        - http
      tags:
      - Groupaccounts

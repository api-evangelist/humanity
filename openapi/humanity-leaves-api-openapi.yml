- url: https://www.humanity.com/api/v2
security:
- sec0: []
tags:
- name: Leaves
paths:
  /leaves/{id}?access_token=xxxx:
    put:
      summary: PUT Leave
      description: '/leaves/:id

        Permission Level: 5'
      operationId: put-leaves
      parameters:
      - name: id
        in: path
        description: Leave  ID
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                unique_id:
                  type: integer
                  description: Custom unique identifier of a leave request.
                  format: int32
                start_date:
                  type: string
                  description: Start date of a requested leave
                end_date:
                  type: string
                  description: End date of a requested leave
                start_time:
                  type: string
                  description: Start time of a requested leave
                end_time:
                  type: string
                  description: End time of a requested leave
                comments:
                  type: string
                  description: Comments which an employee can send at the time of requesting
                notes:
                  type: string
                  description: Additional string field for holding notes.
                status:
                  type: integer
                  description: enum[0, 1, -1, -2]. 0 - Pending for approval, 1 - Approved, -1 - Rejected, -2 - Employee cancelled request
                  format: int32
                force_user_timezone:
                  type: integer
                  description: enum[0, 1]
                  format: int32
                reason:
                  type: string
                  description: Notes that approver can add during approving or rejecting a leave request.
                deduct_days:
                  type: integer
                  description: Number of days to deduct from total requested days
                  format: int32

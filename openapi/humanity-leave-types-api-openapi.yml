info:
  title: default Leave Types API
  version: '2.0'
servers:
- url: https://www.humanity.com/api/v2
security:
- sec0: []
tags:
- name: Leave Types
paths:
  /leave-types/{leave_type}?access_token=xxxxxxx:
    put:
      summary: PUT Leave Type
      description: '/leave-types/:id

        Permission level: 7'
      operationId: put-leave-type
      parameters:
      - name: id
        in: path
        description: Leave Type ID
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                allow_hourly:
                  type: boolean
                days_booked_in_advance:
                  type: integer
                  format: int32
                do_not_deduct:
                  type: boolean
                max_num_at_once:
                  type: integer
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\t\n\t\"stats\": 1, \n\t\"token\": \"31105252bbae716e014cb4653ff9f779cc44d8c7\",\n\t\"data\": \"Allow hourly leave type state changed.\"\n}"
              schema:
                type: object
                properties:
                  stats:
                    type: integer
                    example: 1
                    default: 0
                  token:
                    type: string
                    example: 31105252bbae716e014cb4653ff9f779cc44d8c7
                  data:
                    type: string
                    example: Allow hourly leave type state changed.
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: html
          code: https://www.humanity.com/api/v2/leave-types/1234?access_token=xxxxxxx
        samples-languages:
        - html
      tags:
      - Leave Types
  /leave-types?access_token=xxxxxxx:
    get:
      summary: GET Leave types
      description: '/leaves

        Permission level: 7'
      operationId: get-leave-types-1
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": 1,\n    \"data\": [\n        {\n            \"id\": \"327926\",\n            \"name\": \"Leave Test\",\n            \"description\": \"asd\",\n            \"allow_hourly\": \"1\",\n            \"max_num_of_staff_at_once\": null,\n            \"days_booked_in_advance\": null,\n            \"entitled\": 21,\n            \"created_at\": \"2017-09-21 07:11:08\",\n            \"created_by\": \"3475050\",\n            \"updated_at\": \"2017-09-24 21:05:32\",\n            \"updated_by\": \"3475050\",\n            \"deleted_at\": null,\n            \"deleted_by\": null\n        },\n        {\n            \"id\": \"327924\",\n            \"name\": \"Leave Test 2\",\n            \"description\": \"asdas\",\n            \"allow_hourly\": \"0\",\n            \"max_num_of_staff_at_once\": null,\n            \"days_booked_in_advance\": null,\n            \"entitled\": 12,\n            \"created_at\": \"2017-09-21 07:10:48\",\n            \"created_by\": \"3475050\",\n            \"updated_at\": \"2017-09-24 21:05:38\",\n            \"updated_by\": \"3475050\",\n            \"deleted_at\": null,\n            \"deleted_by\": null\n        },\n        {\n            \"id\": \"327925\",\n            \"name\": \"Leave Test 3\",\n            \"description\": \"11\",\n            \"allow_hourly\": \"1\",\n            \"max_num_of_staff_at_once\": null,\n            \"days_booked_in_advance\": null,\n            \"entitled\": 12,\n            \"created_at\": \"2017-09-21 07:10:59\",\n            \"created_by\": \"3475050\",\n            \"updated_at\": \"2017-09-24 21:05:43\",\n            \"updated_by\": \"3475050\",\n            \"deleted_at\": null,\n            \"deleted_by\": null\n        },\n        {\n            \"id\": \"326594\",\n            \"name\": \"Sick leave\",\n            \"description\": \"boles\",\n            \"allow_hourly\": \"1\",\n            \"max_num_of_staff_at_once\": 12,\n            \"days_booked_in_advance\": null,\n            \"entitled\": 12,\n            \"created_at\": \"2017-09-14 14:28:06\",\n            \"created_by\": \"3475050\",\n            \"updated_at\": \"2017-09-24 21:06:09\",\n            \"updated_by\": \"3475050\",\n            \"deleted_at\": null,\n            \"deleted_by\": null\n        },\n        {\n            \"id\": \"315263\",\n            \"name\": \"Vacation\",\n            \"description\": null,\n            \"allow_hourly\": \"0\",\n            \"max_num_of_staff_at_once\": null,\n            \"days_booked_in_advance\": null,\n            \"entitled\": 20,\n            \"created_at\": \"2017-07-10 13:25:56\",\n            \"created_by\": \"3475050\",\n            \"updated_at\": \"2017-09-13 07:39:38\",\n            \"updated_by\": \"3475050\",\n            \"deleted_at\": null,\n            \"deleted_by\": null\n        }\n    ],\n    \"token\": \"xxxxxxx\",\n    \"error\": null\n}"

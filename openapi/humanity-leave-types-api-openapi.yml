  /leave-types?access_token={{token}}:
    post:
      summary: POST Leave type
      description: 'Permission Level: 5'
      operationId: post-leave-types
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                max_num_at_once:
                  type: integer
                  description: Limits maximum number of staff that can be booked at once
                  format: int32
                days_booked_in_advanc:
                  type: integer
                  description: Sets how many days the leave has to be booked in advance
                  format: int32
                allow_hourly:
                  type: integer
                  description: Can be 0 and 1 - if set to 0 this leave type can only have full day request, if set to 1 it will allow hourly leave requests
                  format: int32
                entitled:
                  type: integer
                  description: Maximum number of days for this leave type
                  format: int32
                title:
                  type: string
                  description: Title of the leave type
                description:
                  type: string
                  description: Leave type description
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": 1,\n    \"data\": {\n        \"id\": \"328497\",\n        \"name\": \"Leave Type API TEST\",\n        \"description\": \"Just a regular remote work\",\n        \"allow_hourly\": \"1\",\n        \"max_num_of_staff_at_once\": 2,\n        \"days_booked_in_advance\": 5,\n        \"entitled\": 22,\n        \"created_at\": \"2017-09-24 21:23:09\",\n        \"created_by\": 3475050,\n        \"updated_at\": null,\n        \"updated_by\": null,\n        \"deleted_at\": null,\n        \"deleted_by\": null\n    },\n    \"token\": \"xxxxxxx\",\n    \"error\": null\n}"
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 1
                    default: 0
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '328497'
                      name:
                        type: string
                        example: Leave Type API TEST
                      description:
                        type: string
                        example: Just a regular remote work
                      allow_hourly:
                        type: string
                        example: '1'
                      max_num_of_staff_at_once:
                        type: integer
                        example: 2
                        default: 0
                      days_booked_in_advance:
                        type: integer
                        example: 5
                        default: 0
                      entitled:
                        type: integer
                        example: 22
                        default: 0
                      created_at:
                        type: string
                        example: '2017-09-24 21:23:09'
                      created_by:
                        type: integer
                        example: 3475050
                        default: 0
                      updated_at: {}
                      updated_by: {}
                      deleted_at: {}
                      deleted_by: {}
                  token:
                    type: string
                    example: xxxxxxx
                  error: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: https://www.humanity.com/api/v2/leave-types?access_token=xxxxxxx
        - language: text
          code: "max_num_at_once=2\ndays_booked_in_advance=5\nallow_hourly=1\nentitled=22\ntitle=Leave Type API TEST \ndescription=Just a regular remote work"
          name: 'BODY PARAMS:'
        samples-languages:
        - http
        - text
      tags:
      - Leave Types

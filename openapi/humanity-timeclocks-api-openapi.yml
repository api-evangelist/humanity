          type: string
          format: date
      - name: schedule
        in: query
        schema:
          type: integer
          format: int32
      - name: employee
        in: query
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        description: '[approved, unapproved]'
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: per_page
        in: query
        schema:
          type: integer
          format: int32
      - name: order_by
        in: query
        description: '[id, end_timestamp]'
        schema:
          type: string
      - name: direction
        in: query
        description: '[asc, desc]'
        schema:
          type: string
      - name: updated_at
        in: query
        description: Returns timeclocks which were updated after the given DateTime.

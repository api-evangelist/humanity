apis:
- name: Humanity HVII Public API
  description: >-
    The Humanity HVII Public API is a REST API for workforce management — employees, positions, locations,
    shifts, shift swaps and trades, timeclocks, leaves, messages, training, tasks (master/shift/employee),
    skills, custom fields, and payroll/schedule/timesheet reports. Authentication is OAuth2 (authorization-code
    / password grant); access tokens are passed as a Bearer token or an access_token query parameter.
    Versions v1.0 and v2.0 are available.
  humanURL: https://platform.humanity.com/
  baseURL: https://www.humanity.com/api/v2/

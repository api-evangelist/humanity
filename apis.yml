aid: humanity
name: Humanity
description: >-
  Humanity (Humanity Schedule) is an employee scheduling and workforce
  management platform owned by TCP Software (TimeClock Plus, LLC). It automates
  shift planning, closes coverage gaps, forecasts demand, and manages labor
  compliance across employees, positions, and locations, with time tracking,
  leave management, training, tasks, and payroll integration. Humanity exposes a
  public REST API (v1.0 and v2.0) documented on its ReadMe-hosted developer
  platform, using OAuth2 for authentication, so integrators can synchronize
  employees, shifts, timeclocks, leaves, reports, skills, and tasks with
  external HR, payroll, and workforce systems.
